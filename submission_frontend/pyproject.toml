[project]
name = "submission-frontend"
version = "0.1.0"
description = "Standalone Manager Dashboard for Ambient Expense Agent Approval Workflow"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "google-adk>=0.4.0",
    "google-cloud-aiplatform>=1.70.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
